<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZitConnect - Complete Registration</title>
    <link rel="stylesheet" href="/static/css/register2.css">
    <style>
      .flash-messages {
        margin: 0 0 20px 0;
        padding: 0;
        list-style: none;
      }
      .flash-messages li {
        padding: 12px;
        margin: 0 0 10px 0;
        border-radius: 5px;
        font-size: 13px;
      }
      .flash-messages .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .flash-messages .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left">
        <p class="left-logo">ZC</p>
        <h3 class="zitconnect">ZitConnect</h3>
        <img src="https://Books-small.png" alt="Books illustration">
      </div>

      <div class="right">
        <h3>Create Account</h3>
        <p>Register using ZitConnect</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flash-messages">
              {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
        
        <form class="form" method="POST" action="/register/complete">
          <label class="program">Program</label>
          <select class="select" name="program" required>
            <option value="">Select a program</option>
            {% for program in programs %}
              <option value="{{ program[0] }}">{{ program[1] }}</option>
            {% endfor %}
          </select>

          <label class="school">School</label>
          <select class="select" name="school" required>
            <option value="">Select a school</option>
            {% for school in schools %}
              <option value="{{ school[0] }}">{{ school[1] }}</option>
            {% endfor %}
          </select>

          <label class="register-as">Register as</label>
          <div class="radio-group">
            <label>
              <input type="radio" name="role" value="tutor" required> Tutor
            </label>
            <label>
              <input type="radio" name="role" value="student" required> Student
            </label>
          </div>

          <div class="buttons">
            <button type="button" class="back-btn" onclick="location.href='/register'">Back</button>
            <button type="submit" class="submit-btn">Submit</button>
          </div>
        </form>

        <div class="login">
          Already Have an Account? <a href="/login">Login</a>
        </div>
      </div>
    </div>
  </body>
</html>
