<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZitConnect - Register</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
      .flash-messages {
        margin: 0 0 20px 0;
        padding: 0;
        list-style: none;
      }
      .flash-messages li {
        padding: 12px;
        margin: 0 0 10px 0;
        border-radius: 5px;
        font-size: 13px;
      }
      .flash-messages .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .flash-messages .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .password-container {
        position: relative;
      }
      .password-match-indicator {
        font-size: 12px;
        margin-top: 5px;
        padding: 8px;
        border-radius: 4px;
        display: none;
        text-align: center;
        font-weight: bold;
      }
      .password-match-indicator.match {
        display: block;
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .password-match-indicator.no-match {
        display: block;
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .next-button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
        opacity: 0.6;
      }
      .next-button:disabled:hover {
        background-color: #ccc;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
        <div style="display:flex; flex-direction:row; align-items:flex-start; gap: 15px; margin-bottom: 10px;">
            <div class="mobile-logo" style="margin-top: 8px;">
                <div class="zc-circle-mobile"><span>ZC</span></div>
            </div>
            <div style="flex:1;">
        <form class="login-form" method="POST" action="/register" id="registerForm">
            <h1>Create Account</h1>
            <p style="margin-top:-10px; text-align:center; color:#fff; font-size:14px;">Register using ZitConnect</p>

            <!-- Flash messages are present server-side but hidden from view to avoid UI clashes.
                 They still work in the background.
            -->
            <div style="display:none;">
              {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                  <ul class="flash-messages">
                    {% for category, message in messages %}
                      <li class="{{ category }}">{{ message }}</li>
                    {% endfor %}
                  </ul>
                {% endif %}
              {% endwith %}
            </div>


            <div class="login-form-group">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="login-form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>

            <div class="login-form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>

            <div class="login-form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" required>
            </div>

            <div class="login-form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" id="confirmPassword" required>
                <div class="password-match-indicator" id="passwordIndicator"></div>
            </div>

            <button class="login-btn" type="submit" id="submitBtn">Next</button>
            
            <p>Already have an account? <a href="/login">Login</a></p>
        </form>
            </div>
        </div>

    <script>
      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const passwordIndicator = document.getElementById('passwordIndicator');
      const submitBtn = document.getElementById('submitBtn');

      function checkPasswordMatch() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (confirmPassword === '') {
          passwordIndicator.style.display = 'none';
          submitBtn.disabled = false;
          return;
        }

        if (password === confirmPassword && password !== '') {
          passwordIndicator.className = 'password-match-indicator match';
          passwordIndicator.textContent = '✓ Passwords match';
          submitBtn.disabled = false;
        } else {
          passwordIndicator.className = 'password-match-indicator no-match';
          passwordIndicator.textContent = '✗ Passwords do not match';
          submitBtn.disabled = true;
        }
      }

      passwordInput.addEventListener('input', checkPasswordMatch);
      confirmPasswordInput.addEventListener('input', checkPasswordMatch);

      // Prevent form submission if passwords don't match
      document.getElementById('registerForm').addEventListener('submit', function(e) {
        if (passwordInput.value !== confirmPasswordInput.value) {
          e.preventDefault();
          alert('Passwords do not match! Please check and try again.');
        }
      });
    </script>
  </body>
</html>
