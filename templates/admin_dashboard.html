<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZitConnect - Admin Dashboard</title>

    <link rel="stylesheet" href="/static/css/admin-dashboard.css">

    <!-- Material icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

<div class="Dashboard">

    <!-- LEFT SIDEBAR -->
    <div class="left">

        <div class="Header">
            <div class="logo-circle"></div>
            <h1>ZitConnect</h1>
        </div>

        <div class="menu-item">
            <span class="material-icons">dashboard</span>
            <span>Dashboard</span>
        </div>

        <div class="menu-item">
            <span class="material-icons">group</span>
            <span>Manage Users</span>
        </div>

        <div class="menu-item">

            <!-- CHANGED: material-icon → material-icons -->
            <span class="material-icons">verified</span>

            <span>Tutor Verification</span>
        </div>

        <div class="menu-item">
            <span class="material-icons">bar_chart</span>
            <span>Course Manager</span>
        </div>

        <div class="menu-item">

            <!-- CHANGED: emoji replaced with material icon -->
            <span class="material-icons">person</span>

            <span>Profile</span>
        </div>

    </div>

    <!-- CHANGED: Removed extra closing div here -->
    <!-- RIGHT SIDE -->

    <div class="right">

        <div class="Welcome_part">
            <h2>Welcome, User</h2>
        </div>

        <!-- Cards -->
        <div class="cards-container">

            <div class="card">
                <h3>Total Earnings</h3>
                <div class="card-value">0</div>
            </div>

            <div class="card">
                <h3>Total Students</h3>
                <div class="card-value">0</div>
            </div>

            <div class="card">
                <h3>Total Tutors</h3>
                <div class="card-value">0</div>
            </div>

        </div>


        <!-- Table section -->

        <div class="bottom">

            <div class="Container">

                <h3>Tutor</h3>
                <h3>Name</h3>
                <h3>Program</h3>
                <h3>Document</h3>
                <h3>Actions</h3>

            </div>


            <!-- Session row -->

            <div class="session-row">

                <!-- CHANGED: sapn → span -->

                <span>-------</span>
                <span>-------</span>
                <span>-------</span>
                <span>-------</span>

                <div class="action-buttons">

                    <button class="accept-btn">
                        Accept
                    </button>

                    <!-- CHANGED: buttton → button -->

                    <button class="decline-btn">
                        Decline
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
