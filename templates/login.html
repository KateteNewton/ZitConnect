<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZitConnect - Login</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0e4e9 0%, #b1bbc9 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .login-container {
        background: linear-gradient(135deg, #49709C 0%, #2d4a6f 100%);
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }
      .login-header {
        text-align: center;
        margin-bottom: 30px;
      }
      .login-header h1 {
        color: white;
        margin: 0 0 10px 0;
        font-size: 28px;
      }
      .login-header p {
        color: white;
        margin: 0;
        font-size: 14px;
      }
      .flash-messages {
        margin: 0 0 20px 0;
        padding: 0;
        list-style: none;
      }
      .flash-messages li {
        padding: 12px;
        margin: 0 0 10px 0;
        border-radius: 5px;
        font-size: 13px;
      }
      .flash-messages .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .flash-messages .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        color: white;
        font-weight: bold;
        font-size: 13px;
      }
      .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 13px;
        font-family: Arial, sans-serif;
      }
      .form-group input:focus {
        outline: none;
        border-color: #49709C;
        box-shadow: 0 0 5px rgba(73, 112, 156, 0.3);
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        background-color: #f4a62a;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .login-btn:hover {
        background-color: #d48a1f;
      }
      .login-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: White;
      }
      .login-footer a {
        color: #d48a1f;
        text-decoration: none;
        font-weight: bold;
      }
      .login-footer a:hover {
        text-decoration: underline;
      }
      @media (max-width: 480px) {
        .login-container {
          padding: 25px;
        }
        .login-header h1 {
          font-size: 22px;
        }
      }
    </style>
</head>
<body>
    <div class="login-container">
      <div class="login-header">
        <h1>ZitConnect</h1>
        <p>Peer to Peer Academic Support</p>
      </div>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="flash-messages">
            {% for category, message in messages %}
              <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      <form method="POST" action="/login">
        <div class="form-group">
          <label for="email">Email Address / Username</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>

      <div class="login-footer">
        Don't have an account? <a href="/register">Register here</a>
      </div>
    </div>
</body>
</html>
