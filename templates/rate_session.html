<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Session | ZitConnect</title>

    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=Material+Symbols+Outlined:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/rate_session.css">
</head>
<body>

    <nav class="top-bar">
        <div class="nav-left">
            <div class="logo-circle">zc</div>
        </div>
        <div class="nav-center">
            <span class="nav-title">Rate Session</span>
        </div>
        <div class="nav-right">
            <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-input" placeholder="Search...">
            </div>
            <div class="profile-container">
                <img src="/static/ai1.png" alt="Profile" class="profile-img">
            </div>
        </div>
    </nav>

    <div class="dashboard-wrapper">
        
        <aside class="left-sidebar">
            <div class="sidebar-menu">
                <a href="#" class="sidebar-item">
                    <span class="material-symbols-outlined">home</span>
                    <span class="item-text">Home</span>
                </a>
                <a href="#" class="sidebar-item">
                    <span class="material-symbols-outlined">search</span>
                    <span class="item-text">Browse</span>
                </a>
                <a href="#" class="sidebar-item active-nav">
                    <div class="active-icon-wrapper">
                        <span class="material-symbols-outlined">event_note</span>
                    </div>
                    <span class="item-text">Sessions</span>
                </a>
                <a href="#" class="sidebar-item">
                    <span class="material-symbols-outlined">person</span>
                    <span class="item-text">Profile</span>
                </a>
            </div>
        </aside>

        <main class="container">

            <section class="tutor-card">
                <div class="tutor-image">
                    <img src="/static/ai1.png" alt="Mr. Chanda Musonda">
                </div>
                <div class="tutor-info">
                    <span class="session-label">COMPLETED SESSION</span>
                    <h2>Mr. Chanda Musonda</h2>
                    <p>Calculus II • Copperbelt University</p>
                </div>
            </section>

            <section class="rating-card">
                <h1>How was your session?</h1>
                <p class="subtitle">Your feedback helps us maintain high teaching standards.</p>

                <div class="stars" id="star-container">
                    <span class="material-symbols-outlined star active" data-rating="1">star</span>
                    <span class="material-symbols-outlined star active" data-rating="2">star</span>
                    <span class="material-symbols-outlined star active" data-rating="3">star</span>
                    <span class="material-symbols-outlined star active" data-rating="4">star</span>
                    <span class="material-symbols-outlined star active" data-rating="5">star</span>
                </div>

                <label for="feedback">Comments (Optional)</label>
                <textarea id="feedback" placeholder="Share your experience with this session..."></textarea>

                <button id="submit-btn">
                    <span>Submit Rating</span>
                    <span class="material-symbols-outlined">send</span>
                </button>
            </section>

            <section class="tags">
                <button class="tag">Clear explanations</button>
                <button class="tag">Very patient</button>
                <button class="tag">Great examples</button>
                <button class="tag">On time</button>
            </section>

        </main>
    </div>

    <script>
        // Star Interactive Handling Logic
        const stars = document.querySelectorAll('.star');
        let currentRating = 5;

        function highlightStars(rating) {
            stars.forEach(star => {
                const value = parseInt(star.dataset.rating);
                if (value <= rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        stars.forEach(star => {
            star.addEventListener('click', () => {
                currentRating = parseInt(star.dataset.rating);
                highlightStars(currentRating);
            });
        });

        // Multi-select Feedback Tags Selector logic
        const tags = document.querySelectorAll('.tag');
        tags.forEach(tag => {
            tag.addEventListener('click', () => {
                tag.classList.toggle('selected');
            });
        });

        // Form Submit Handler
        document.getElementById('submit-btn').addEventListener('click', () => {
            const selectedTags = [];
            document.querySelectorAll('.tag.selected').forEach(tag => {
                selectedTags.push(tag.textContent.trim());
            });
            const comment = document.getElementById('feedback').value;
            
            alert(`Rating Submitted!\nStars: ${currentRating}\nTags: ${selectedTags.join(', ') || 'None'}`);
        });
    </script>

</body>
</html>
